[package]
name = "airdap-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
btleplug = "0.11"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
openssl = { version = "0.10", features = ["vendored"] }
prost = "0.14"
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
tokio-openssl = "0.6"
uuid = "1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.61", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
